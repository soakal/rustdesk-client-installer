name: leak-check
on: [push, pull_request]
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check for private files and strings
        env:
          PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          f="$RUNNER_TEMP/leak-patterns"
          printenv PATTERNS | grep . > "$f" || true
          LEAK_PATTERNS="$f" ./leak-check.sh
      - name: Syntax
        run: for f in make.sh build.sh guides.sh leak-check.sh templates/install-unix.sh; do bash -n "$f"; done
